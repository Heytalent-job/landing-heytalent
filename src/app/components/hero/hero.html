<section class="hero">
  <div class="hero__blob hero__blob--left blob" aria-hidden="true"></div>
  <div class="hero__blob hero__blob--right blob" aria-hidden="true"></div>

  <div class="hero__inner container">
    <div>
      <span class="hero__eyebrow">{{ hero.eyebrow }}</span>
      <h1 class="hero__title">{{ hero.title }}</h1>
      <p class="hero__subtitle">{{ hero.subtitle }}</p>

      <div class="search shadow-soft">
        <div class="search__field">
          <app-icon class="search__icon" name="search" />
          <input
            class="search__input"
            type="search"
            [placeholder]="hero.searchPlaceholder"
            [attr.aria-label]="hero.searchPlaceholder"
            [value]="query()"
            (input)="onInput($event)"
          />
        </div>
        <a class="btn btn--primary search__submit" [href]="searchHref">Buscar empleos</a>
      </div>

      <div class="hero__actions">
        <a class="btn btn--secondary btn--pill" href="/cuenta">Crear cuenta</a>
        <a class="btn btn--on-hero btn--pill" href="/empresas">Soy empresa</a>
      </div>
    </div>

    <div class="hero__art">
      <div class="hero__art-blob blob" aria-hidden="true"></div>
      <img class="hero__logo shadow-soft" [src]="brand.logo" [alt]="'Logo de ' + brand.name" />
    </div>
  </div>
</section>
