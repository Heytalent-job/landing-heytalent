<section class="section" id="testimonios">
  <div class="section-inner centered">
    <span class="section-tag">Opiniones</span>
    <h2>Lo que dicen nuestros participantes</h2>
    <p class="sub">
      Historias reales de jóvenes que transformaron su trayectoria profesional con HeyTalent.
    </p>

    <div class="testi-grid">
      @for (testimonial of testimonials; track testimonial.name) {
        <figure class="testi-card" [class.feat]="testimonial.featured">
          <div class="stars" aria-label="5 de 5 estrellas">★★★★★</div>
          <blockquote>"{{ testimonial.quote }}"</blockquote>
          <figcaption class="testi-author">
            <div class="avatar" aria-hidden="true">{{ testimonial.initials }}</div>
            <div class="who">
              <div class="name">{{ testimonial.name }}</div>
              <div class="meta">{{ testimonial.meta }}</div>
            </div>
          </figcaption>
        </figure>
      }
    </div>
  </div>
</section>
