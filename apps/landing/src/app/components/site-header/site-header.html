<header class="header">
  <div class="header__bar container">
    <a class="brand" href="/">
      <img class="brand__logo shadow-card" [src]="brand.logo" [alt]="'Logo de ' + brand.name" />
      <span class="brand__name">{{ brand.name }}</span>
    </a>

    <!-- Navegación de escritorio — visible a partir de `lg` -->
    <nav class="nav" aria-label="Secciones de la página">
      @for (link of navLinks; track link.href) {
        <a class="nav__link" [href]="link.href">{{ link.label }}</a>
      }
    </nav>

    <!-- Botón del menú — visible por debajo de `lg` -->
    <button
      class="header__toggle"
      type="button"
      (click)="toggleMenu()"
      [attr.aria-expanded]="menuOpen()"
      aria-controls="menu-movil"
      [attr.aria-label]="menuOpen() ? 'Cerrar menú' : 'Abrir menú'"
    >
      <app-icon [name]="menuOpen() ? 'x' : 'menu'" />
    </button>

    <!-- Acciones de sesión ocultadas temporalmente:
    <div class="header__actions">
      <a class="btn btn--ghost btn--pill" href="/cuenta">Iniciar sesión</a>
      <a class="btn btn--primary btn--pill shadow-soft" href="/cuenta">Registrarse</a>
    </div>
    -->
  </div>

  @if (menuOpen()) {
    <nav class="menu" id="menu-movil" aria-label="Secciones de la página">
      <div class="menu__links">
        @for (link of navLinks; track link.href) {
          <a class="nav__link" [href]="link.href" (click)="closeMenu()">{{ link.label }}</a>
        }
      </div>
    </nav>
  }
</header>
