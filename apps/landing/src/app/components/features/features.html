<section class="features">
  <div class="container">
    <h2>Todo lo que necesitas</h2>

    <div class="features__grid">
      @for (item of features; track item.title) {
        <article class="feature shadow-card">
          <app-icon class="feature__icon" [name]="item.icon" />
          <h3 class="feature__name">{{ item.title }}</h3>
          <p class="feature__text">{{ item.description }}</p>
        </article>
      }
    </div>
  </div>
</section>
