<footer class="footer">
  <div class="container footer__inner">
    <div class="footer__grid">
      <div>
        <div class="footer__brand">
          <img class="footer__logo" [src]="brand.logo" [alt]="brand.name" />
          <span class="footer__name">{{ brand.name }}</span>
        </div>
        <p class="footer__tagline">{{ brand.tagline }}</p>

        <div class="footer__socials">

  <span
    class="footer__social"
    aria-label="Instagram de Hey Talent"
  >
    <app-icon name="instagram" />
  </span>

  <a
    class="footer__social"
    [href]="linkedinUrl"
    target="_blank"
    rel="noopener noreferrer"
    aria-label="LinkedIn de Hey Talent"
  >
    <app-icon name="linkedin" />
  </a>

</div>
      </div>

      @for (column of columns; track column.title) {
        <div>
          <h3 class="footer__heading">{{ column.title }}</h3>
          <ul class="footer__links">
            @for (link of column.links; track link.label) {
              <li><a class="footer__link" [href]="link.href">{{ link.label }}</a></li>
            }
          </ul>
        </div>
      }
    </div>

    <p class="footer__legal">
      © {{ year }} {{ brand.name }}. Hecho para conectar talento y oportunidades.
    </p>
  </div>
</footer>
