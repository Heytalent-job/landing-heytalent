<section class="hero-custom">
  <!-- Burbujas 3D con reflejo estilo Hey Talent -->
  <div class="bubble-glass bubble--left-top" aria-hidden="true"></div>
  <div class="bubble-glass bubble--left-mid" aria-hidden="true"></div>
  <div class="bubble-glass bubble--left-bot" aria-hidden="true"></div>

  <div class="bubble-glass bubble--right-top" aria-hidden="true"></div>
  <div class="bubble-glass bubble--right-mid" aria-hidden="true"></div>
  <div class="bubble-glass bubble--right-bot" aria-hidden="true"></div>

  <div class="bubble-glass bubble--center-top" aria-hidden="true"></div>
  <div class="bubble-glass bubble--center-mid" aria-hidden="true"></div>
  <div class="bubble-glass bubble--bottom-subtle" aria-hidden="true"></div>

  <div class="container hero-content">
    <!-- Badge -->
    <span class="hero__eyebrow">{{ hero.eyebrow }}</span>

    <!-- Título con "Hey Talent" resaltado -->
    <h1 class="hero__title">
      <span class="highlight-brand">Hey Talent:</span> tu red para conseguir el trabajo que quieres
    </h1>

    <p class="hero__subtitle">{{ hero.subtitle }}</p>


    <!-- Mosaico / Galería de Fotos + Buscador Arriba -->
    <div class="hero-stage">
      <!-- Mosaico de tarjetas -->
      <div class="stage-mosaic">
        <!-- Tarjeta 1: Logo Hey Talent -->
        <div class="mosaic-card card--logo shadow-soft">
          <img [src]="brand.logo" [alt]="'Logo de ' + brand.name" />
        </div>

        <!-- Tarjeta 2: Foto equipo izquierda (con extensión agregada) -->
        <div class="mosaic-card card--pic-1 shadow-soft">
          <img src="images/coe_evento_talent.jpg" alt="Talento trabajando" />
        </div>

        <!-- Tarjeta 3: Foto central principal -->
        <div class="mosaic-card card--pic-main shadow-soft">
          <img src="images/hey_talent_integración.jpg" alt="Comunidad Hey Talent" />
        </div>

        <!-- Tarjeta 4: Foto personas derecha (con extensión agregada) -->
        <div class="mosaic-card card--pic-2 shadow-soft">
          <img src="images/comunidad-taller.jpg" alt="Equipo tech" />
        </div>

        <!-- Tarjeta 5: Foto complementaria -->
        <div class="mosaic-card card--pic-3 shadow-soft">
          <img src="images/networking-evento.jpg" alt="Estudiantes tech" />
        </div>
      </div>

      <!-- Buscador elevado flotando encima del mosaico -->
      <div class="stage-search-overlay shadow-soft">
        <div class="search__field">
          <app-icon class="search__icon" name="search" />
          <input
            class="search__input"
            type="search"
            [placeholder]="hero.searchPlaceholder"
            [attr.aria-label]="hero.searchPlaceholder"
            [value]="query()"
            (input)="onInput($event)"
          />
        </div>
        <a class="btn btn--primary search__submit" [href]="searchHref">Buscar empleos</a>
      </div>
    </div>
  </div>
</section>
